name: Publicar imagem

# Builda e publica um manifest multi-arch (amd64+arm64) em ghcr.io ao criar uma
# tag "v*", ou sob demanda. Sem setup-qemu: o Dockerfile cross-compila o
# binário Go (CGO_ENABLED=0), então nenhum estágio roda RUN fora da
# plataforma nativa do runner.
#
# Builds and publishes a multi-arch manifest (amd64+arm64) to ghcr.io on a
# "v*" tag, or on demand. No setup-qemu: the Dockerfile cross-compiles the Go
# binary (CGO_ENABLED=0), so no stage runs RUN outside the runner's native
# platform.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wallacepnts/vaultzap:latest
            ghcr.io/wallacepnts/vaultzap:${{ github.ref_name }}
